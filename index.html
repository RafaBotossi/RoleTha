<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>RoleTHA do Exercício</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <section class="intro-screen" id="introScreen" aria-label="Tela inicial">
        <button class="logo-start" id="logoStart" type="button" aria-label="Abrir a roleta">
          <img src="Artes/logo.png" alt="RoleTHA do Exercício">
        </button>
      </section>

      <section class="roulette-screen" id="rouletteScreen" aria-label="Roleta da sorte de exercícios" hidden>
        <div class="machine">
          <div class="wheel-zone">
            <div class="selector" aria-hidden="true"></div>
            <div class="wheel-shadow" aria-hidden="true"></div>
            <div class="wheel" id="wheel">
              <div class="wheel-glass" aria-hidden="true"></div>
              <div class="hub">
                <img src="Artes/logo.png" alt="RoleTHA">
              </div>
            </div>
          </div>

          <aside class="lever-panel" aria-label="Manopla da roleta">
            <div class="lever-track">
              <button class="lever" id="lever" type="button" aria-label="Puxar manopla para girar">
                <span class="lever-knob"></span>
                <span class="lever-arm"></span>
              </button>
            </div>
            <button class="spin-button" id="spinButton" type="button">Girar</button>
          </aside>
        </div>

        <div class="result-strip" id="resultCard" aria-live="polite">
          <span>Hoje caiu</span>
          <strong id="resultText">Puxe a manopla</strong>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
